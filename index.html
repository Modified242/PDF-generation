<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProConvert - File Converter & QR Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Ingyenes, böngészőben futó PDF és képkonvertáló. PDF egyesítés, darabolás, forgatás, vízjelezés, titkosítás és QR kód generálás szerver feltöltés nélkül.">
    <meta name="keywords" content="PDF konvertáló, PDF egyesítés, PDF darabolás, képből PDF, QR kód generátor, ingyenes PDF eszközök">
    <meta name="author" content="ProConvert">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="ProConvert - Ingyenes PDF és Kép Eszközök">
    <meta property="og:description" content="Kezeld a PDF fájljaidat közvetlenül a böngésződben. Villámgyors, biztonságos és 100% ingyenes.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://proconvert.pelda.hu/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://proconvert.pelda.hu/">
    
    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ProConvert",
      "url": "https://proconvert.pelda.hu/",
      "description": "Ingyenes, böngészőalapú PDF és képmanipuláló eszközök.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "HUF"
      }
    }
    </script>
</head>
<body>
    <div id="toastContainer"></div>
    <header class="top-navbar">
        <div class="logo" id="homeLogo" style="cursor: pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>ProConvert</span>
        </div>
        <div class="nav-actions">
            <select id="langSelect" class="lang-select">
                <option value="en">🇬🇧 EN</option>
                <option value="hu">🇭🇺 HU</option>
                <option value="de">🇩🇪 DE</option>
                <option value="es">🇪🇸 ES</option>
                <option value="fr">🇫🇷 FR</option>
            </select>
            <button class="theme-toggle" id="themeToggle" title="Theme toggle">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="btn btn-outline" id="settingsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;margin-right:8px;vertical-align:middle;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.67 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.67a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span data-i18n="settings">Settings</span>
            </button>
        </div>
    </header>

    <main class="main-container">
        <div id="homeView" class="view-section active">
            <div class="grid-header">
                <h2 data-i18n="home_title">All PDF and Image Tools</h2>
                <p data-i18n="home_desc">Select the tool you want to use for quick conversion and editing.</p>
            </div>
            <div class="tools-grid" id="toolsGrid"></div>
        </div>

        <div id="toolView" class="view-section" style="display: none;">
            <button class="btn btn-outline back-btn" id="backToHomeBtn" style="margin-bottom: 24px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span data-i18n="back_to_tools">Back to tools</span>
            </button>
            <header class="main-header"><h1 id="pageTitle">...</h1><p id="pageDesc">...</p></header>

            <section id="converterSection" class="section-active">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <div class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
                        <h3 data-i18n="drop_title">Drop files here</h3>
                        <p data-i18n="drop_or">or <span class="browse-link">click to browse</span></p>
                    </div>
                    <input type="file" id="fileInput" multiple style="display: none;">
                </div>
                <div class="file-list" id="fileList"></div>
                
                <!-- Advanced Watermark Panel -->
                <div id="watermarkPanel" style="display: none; margin-top: 24px; padding: 24px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                    <h3 style="margin-bottom: 16px;">Vízjel Beállítások</h3>
                    
                    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                        <button class="btn btn-primary" id="wmTabText">Szöveg beírása</button>
                        <button class="btn btn-outline" id="wmTabImage">Kép feltöltése (PNG/JPG)</button>
                    </div>
                    
                    <!-- Text Settings -->
                    <div id="wmTextSection">
                        <div class="control-group">
                            <label>Vízjel Szövege</label>
                            <input type="text" id="wmText" value="PISZKOZAT" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);">
                        </div>
                        <div class="control-group" style="margin-top: 12px;">
                            <label>Szín</label><br>
                            <input type="color" id="wmColor" value="#ef4444" style="width: 60px; height: 40px; cursor: pointer; border: none; border-radius: 4px;">
                        </div>
                    </div>

                    <!-- Image Settings -->
                    <div id="wmImageSection" style="display: none;">
                        <div class="control-group">
                            <label>Saját Kép Fájl (Logó)</label>
                            <input type="file" id="wmImageFile" accept="image/png, image/jpeg" style="width: 100%; padding: 10px; background: var(--bg-secondary); border-radius: 4px; border: 1px solid var(--border-color);">
                        </div>
                    </div>

                    <!-- Common Controls -->
                    <div class="control-row" style="margin-top: 24px;">
                        <div class="control-group"><label>Pozíció X (%)</label><input type="range" id="wmX" min="0" max="100" value="50" class="slider"></div>
                        <div class="control-group"><label>Pozíció Y (%)</label><input type="range" id="wmY" min="0" max="100" value="50" class="slider"></div>
                    </div>
                    <div class="control-row">
                        <div class="control-group"><label>Méret / Skálázás</label><input type="range" id="wmSize" min="10" max="300" value="100" class="slider"></div>
                        <div class="control-group"><label>Forgatás (fok)</label><input type="range" id="wmRot" min="-180" max="180" value="45" class="slider"></div>
                    </div>
                    <div class="control-group"><label>Átlátszóság (%)</label><input type="range" id="wmOpac" min="10" max="100" value="30" class="slider"></div>
                    
                    <!-- Preview Area -->
                    <button class="btn btn-outline btn-full" id="wmPreviewBtn" style="margin-top: 16px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;margin-right:8px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        Élő előnézet generálása (PDF feltöltése után)
                    </button>
                    <div style="text-align: center; margin-top: 16px;">
                        <canvas id="wmCanvas" style="max-width: 100%; border: 1px dashed var(--border-color); border-radius: 4px; display: none; box-shadow: var(--shadow-sm);"></canvas>
                    </div>
                </div>

                <div class="batch-actions" id="batchActions" style="display: none;">
                    <div class="batch-info"><span id="batchCount">0 files</span><span id="batchSize">0 MB</span></div>
                    <div class="batch-buttons">
                        <button class="btn btn-outline" id="clearAllBtn" data-i18n="clear_all">Clear All</button>
                        <button class="btn btn-primary" id="convertAllBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> <span id="convertBtnText">Start</span></button>
                    </div>
                </div>
            </section>

            <section id="qrSection" style="display: none;">
                <div class="qr-layout">
                    <div class="qr-controls">
                        <div class="control-group"><label data-i18n="qr_content">Content</label><textarea id="qrInputData" data-i18n-placeholder="qr_placeholder" rows="4"></textarea></div>
                        <div class="control-row">
                            <div class="control-group"><label data-i18n="qr_fg">Foreground Color</label><div class="color-picker-wrapper"><input type="color" id="qrColorDark" value="#000000"><span class="color-value">#000000</span></div></div>
                            <div class="control-group"><label data-i18n="qr_bg">Background Color</label><div class="color-picker-wrapper"><input type="color" id="qrColorLight" value="#ffffff"><span class="color-value">#ffffff</span></div></div>
                        </div>
                        <div class="control-row">
                            <div class="control-group"><label data-i18n="qr_size">Size (px)</label><input type="range" id="qrSize" min="100" max="600" value="300" class="slider"><span class="slider-value" id="qrSizeValue">300px</span></div>
                            <div class="control-group"><label data-i18n="qr_err">Error Correction</label><select id="qrErrorLevel"><option value="1">Low (L)</option><option value="0">Medium (M)</option><option value="3">Quartile (Q)</option><option value="2" selected>High (H)</option></select></div>
                        </div>
                        <button class="btn btn-primary btn-full" id="generateQrBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> <span data-i18n="generate_qr">Generate QR Code</span></button>
                    </div>
                    <div class="qr-preview-panel">
                        <div class="qr-preview-box" id="qrPreviewBox"><div class="qr-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><p data-i18n="qr_placeholder">QR code will appear here</p></div></div>
                        <div class="qr-actions" id="qrActions" style="display: none;"><button class="btn btn-outline" id="copyQrBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> <span data-i18n="qr_copy">Copy</span></button><button class="btn btn-primary" id="downloadQrBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> <span data-i18n="qr_dl">Download PNG</span></button></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header"><h2 data-i18n="settings_title">Settings</h2><button class="modal-close" id="closeSettings">&times;</button></div>
            <div class="modal-body">
                <div class="setting-item"><div class="setting-info"><label data-i18n="set_jpg_q">JPG Quality</label></div><div class="setting-control"><input type="range" id="jpgQuality" min="10" max="100" value="90" class="slider"><span class="slider-value" id="jpgQualityValue">90%</span></div></div>
                <div class="setting-item"><div class="setting-info"><label data-i18n="set_pdf_dpi">PDF Resolution (DPI)</label></div><div class="setting-control"><input type="range" id="pdfDpi" min="72" max="300" value="150" class="slider" step="10"><span class="slider-value" id="pdfDpiValue">150 DPI</span></div></div>
                <div class="setting-item"><div class="setting-info"><label data-i18n="set_webp_q">WebP Quality</label></div><div class="setting-control"><input type="range" id="webpQuality" min="10" max="100" value="80" class="slider"><span class="slider-value" id="webpQualityValue">80%</span></div></div>
                <div class="setting-item"><div class="setting-info"><label data-i18n="set_auto_dl">Auto Download</label></div><div class="setting-control"><label class="toggle-switch"><input type="checkbox" id="autoDownload" checked><span class="toggle-slider"></span></label></div></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal modal-large"><div class="modal-header"><h2 data-i18n="preview_title">Preview</h2><button class="modal-close" id="closePreview">&times;</button></div><div class="modal-body"><div class="preview-container" id="previewContainer"></div></div></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
